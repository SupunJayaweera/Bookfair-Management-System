version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: bookfair-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookfair_users
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bookfair-network

  # Apache Kafka and Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: bookfair-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bookfair-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: bookfair-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bookfair-network

  # Eureka Server
  eureka-server:
    build:
      context: ./bookfair-backend/eureka-server
      dockerfile: Dockerfile
    container_name: bookfair-eureka
    ports:
      - "8761:8761"
    networks:
      - bookfair-network

  # API Gateway
  api-gateway:
    build:
      context: ./bookfair-backend/api-gateway
      dockerfile: Dockerfile
    container_name: bookfair-gateway
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - bookfair-network

  # User Service
  user-service:
    build:
      context: ./bookfair-backend/user-service
      dockerfile: Dockerfile
    container_name: bookfair-user-service
    depends_on:
      - mysql
      - eureka-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookfair_users?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - bookfair-network

  # Stall Service
  stall-service:
    build:
      context: ./bookfair-backend/stall-service
      dockerfile: Dockerfile
    container_name: bookfair-stall-service
    depends_on:
      - mysql
      - eureka-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookfair_stalls?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - bookfair-network

  # Reservation Service
  reservation-service:
    build:
      context: ./bookfair-backend/reservation-service
      dockerfile: Dockerfile
    container_name: bookfair-reservation-service
    depends_on:
      - mysql
      - kafka
      - eureka-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookfair_reservations?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - bookfair-network

  # Notification Service
  notification-service:
    build:
      context: ./bookfair-backend/notification-service
      dockerfile: Dockerfile
    container_name: bookfair-notification-service
    depends_on:
      - kafka
      - eureka-server
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${EMAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${EMAIL_PASSWORD}
    networks:
      - bookfair-network

volumes:
  mysql-data:

networks:
  bookfair-network:
    driver: bridge
